name: CI build & test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lcov libcmocka-dev llvm gcovr

      - name: Build everything (Makefile)
        run: make -C Tests/unit_tests all

      - name: Run unit + edge tests
        run: make -C Tests/unit_tests test

      - name: Capture coverage
        run: make -C Tests/unit_tests coverage

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: Tests/unit_tests/cov_html
