name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-latest      # keep using the default, non-deprecated image

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add LLVM repo & install Clang-10 toolchain
        run: |
          # Import the LLVM GPG key and add the LLVM 10 repo for this Ubuntu
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/$(. /etc/os-release && echo $UBUNTU_CODENAME)/ llvm-toolchain-$(. /etc/os-release && echo $UBUNTU_CODENAME)-10 main"
          sudo apt-get update
          # Now clang-10, llvm-10, libclang-10-dev become available
          sudo apt-get install -y \
            clang-10 llvm-10 libclang-10-dev \
            build-essential lcov libcmocka-dev python3-pip

          # Point /usr/bin/clang & llvm-config at the v10 versions
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-10 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-10 100

          # Install the Python bindings so your autofuzz_scan.py can load libclang
          pip3 install clang

      - name: Build everything
        run: make all

      - name: Run unit & fuzz-tests
        run: make test

      - name: Generate coverage HTML
        if: success()
        run: make coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cov_html/
