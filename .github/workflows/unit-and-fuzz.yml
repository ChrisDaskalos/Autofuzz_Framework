name: Unit, Edge, and Fuzz Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests
    
    env:
      FUZZ_CC: clang-18
      FUZZ_MAX_SECS: "60"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PYTHONPATH: ${{ github.workspace }}/Tests/unit_tests
      # Enable colored output for CMocka
      CMOCKA_MESSAGE_OUTPUT: STDOUT
      CMOCKA_COLOR: on
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-18 \
            llvm-18-dev \
            libclang-18-dev \
            libclang-rt-18-dev \
            python3-clang-18 \
            libcmocka-dev
      
      - name: Configure LLVM environment
        run: |
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYMBOLIZER_PATH=/usr/lib/llvm-18/bin/llvm-symbolizer" >> "$GITHUB_ENV"
      
      - name: Clean build artifacts
        run: make clean
      
      - name: Build all tests (generate + compile)
        run: |
          echo "::group::Build Output"
          make build
          echo "::endgroup::"
      
      - name: Run manual unit tests
        id: unit_tests
        run: |
          echo "::group::Manual Unit Tests"
          make unit || echo "UNIT_FAILED=true" >> $GITHUB_OUTPUT
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Run deterministic edge tests
        id: edge_tests
        run: |
          echo "::group::Deterministic Edge Tests"
          make edge || echo "EDGE_FAILED=true" >> $GITHUB_OUTPUT
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Check unit and edge test results
        if: steps.unit_tests.outputs.UNIT_FAILED == 'true' || steps.edge_tests.outputs.EDGE_FAILED == 'true'
        run: |
          echo "❌ Some tests failed!"
          if [ "${{ steps.unit_tests.outputs.UNIT_FAILED }}" == "true" ]; then
            echo "  - Manual unit tests FAILED"
          fi
          if [ "${{ steps.edge_tests.outputs.EDGE_FAILED }}" == "true" ]; then
            echo "  - Edge tests FAILED"
          fi
          exit 1
      
      - name: Run random fuzzing tests (60s per fuzzer)
        id: fuzz_tests
        run: |
          echo "::group::Random Fuzzing Tests"
          make fuzz || echo "FUZZ_COMPLETED=true" >> $GITHUB_OUTPUT
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Check for crashes
        if: always()
        id: crash_check
        run: |
          if [ -d crashes ] && [ -n "$(ls -A crashes/ 2>/dev/null)" ]; then
            echo "❌ Fuzzing found crashes!"
            echo "📁 Crash files:"
            ls -lh crashes/
            echo "CRASHES_FOUND=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ No crashes found!"
            echo "CRASHES_FOUND=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Unit Tests
          if [ "${{ steps.unit_tests.outputs.UNIT_FAILED }}" == "true" ]; then
            echo "❌ **Manual Unit Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Manual Unit Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Edge Tests
          if [ "${{ steps.edge_tests.outputs.EDGE_FAILED }}" == "true" ]; then
            echo "❌ **Edge Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Edge Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Fuzz Tests
          if [ "${{ steps.crash_check.outputs.CRASHES_FOUND }}" == "true" ]; then
            echo "❌ **Fuzzing Tests**: CRASHES FOUND" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Fuzzing Tests**: NO CRASHES" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: Tests/unit_tests/crashes/
          if-no-files-found: ignore
      
      - name: Upload fuzzer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs-${{ github.sha }}
          path: Tests/unit_tests/logs/
          if-no-files-found: ignore
      
      - name: Upload test corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.sha }}
          path: Tests/unit_tests/lf_corpus/
          if-no-files-found: ignore