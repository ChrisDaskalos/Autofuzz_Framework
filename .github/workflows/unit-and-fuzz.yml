name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain, libs & Python clang bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm lcov libclang-dev \
            build-essential libcmocka-dev python3-pip
          pip3 install clang

      - name: Build everything
        run: make all

      - name: Run unit & fuzz-tests
        run: make test

      - name: Generate coverage HTML
        if: success()
        run: make coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cov_html/
