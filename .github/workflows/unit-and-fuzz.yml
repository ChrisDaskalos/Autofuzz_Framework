name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    env:
      CC: clang-18
      FUZZ_CC: clang-18
      FUZZ_SMOKE_SECS: "5"
      FUZZ_MAX_SECS: "30"
      LIBCLANG_PATH: /usr/lib/llvm-18/lib

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain & libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18-dev libclang-18-dev python3-clang-18 \
            build-essential libcmocka-dev

      - name: Add LLVM to LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Build (gen + unit/edge/fuzz)
        run: make all

      - name: Run unit, edge, and smoke fuzz
        run: make test
        continue-on-error: true

      - name: Full fuzz campaign
        run: make fuzz
        continue-on-error: true

      - name: Upload crashes (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: Tests/unit_tests/crashes
          if-no-files-found: warn
