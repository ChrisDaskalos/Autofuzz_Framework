name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    env:
      FUZZ_CC: clang-18
      FUZZ_MAX_SECS: "60"                  # ≥ 1 minute
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      PYTHONPATH: ${{ github.workspace }}/Tests/unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain & libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-18 llvm-18-dev libclang-18-dev libclang-rt-18-dev \
            python3-clang-18 \
            libcmocka-dev

      - name: Export LLVM runtime path (for libclang/asan)
        run: |
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LLVM_SYMBOLIZER_PATH=/usr/lib/llvm-18/bin/llvm-symbolizer" >> "$GITHUB_ENV"

      - name: Clean
        run: make clean

      - name: Build (gen + unit/edge/fuzz)
        run: make all

      - name: Full fuzz campaign (60s)
        run: make fuzz
        continue-on-error: true

      - name: Upload crashes (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: Tests/unit_tests/crashes
          if-no-files-found: warn
