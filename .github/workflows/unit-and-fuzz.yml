name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-latest      # 24.04, LLVM/Clang 18

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Clang-18 toolchain, matching Python bindings, and libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18-dev libclang-18-dev python3-clang-18 \
            build-essential lcov libcmocka-dev

      - name: Point LIBCLANG_PATH at LLVM 18
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Build everything
        run: make all

      - name: Run unit & fuzz tests
        run: make test

      - name: Generate coverage HTML
        if: success()
        run: make coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cov_html/
