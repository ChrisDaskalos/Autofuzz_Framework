name: unit-and-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  servo-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Tests/unit_tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Clang-10 toolchain, libs & Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-10 llvm-10 libclang-10-dev \
            build-essential lcov libcmocka-dev python3-pip
          # Point the `clang` command to clang-10
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-10 100
          sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-10 100
          pip3 install clang

      - name: Build everything
        run: make all

      - name: Run unit & fuzz-tests
        run: make test

      - name: Generate coverage HTML
        if: success()
        run: make coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: cov_html/
