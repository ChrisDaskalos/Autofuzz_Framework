# autofuzz.yaml - settings for AutoFuzz on this project.
#
# Run:  autofuzz run        (checks tools, generates tests, compiles, runs)
# Paths are relative to this file. All keys: docs/CONFIG.md.
# A key you leave out keeps its default (autofuzz/defaults.yaml).
#
# To start, fill in the 3 keys marked REQUIRED:
#   sources, include_dirs, harness.includes
# Every key marked Optional can stay as it is.

# REQUIRED. The .c files to test. AutoFuzz writes tests for their non-static functions.
# Example:
#   sources:
#     - src/parser.c
#     - src/ringbuf.c
sources: []

# REQUIRED. Folders with the .h files your sources include (passed as -I, in this order).
# Example:
#   include_dirs:
#     - include
#     - tests/fakes
include_dirs: []

# Optional. Folders with fake headers (for example a fake HAL). They come
# BEFORE include_dirs, so they replace the real headers of the same name.
# `builtin:stm32f1_hal` is the fake STM32F1 HAL that comes with AutoFuzz.
# Example:
#   fake_include_dirs:
#     - builtin:stm32f1_hal
#     - tests/fakes
fake_include_dirs: []

# Optional. Preprocessor defines (passed as -D).
# Example:
#   defines:
#     - UNIT_TEST
#     - BUFFER_SIZE=64
defines: []

# Optional. Extra compiler flags. Example:  cflags: [-std=c99]
cflags: [-std=c11]

# Optional. The C compiler. It must be clang (libFuzzer). Example:  compiler: clang-18
compiler: clang

# Optional. Which functions to test. Shell-style patterns; an empty include = all.
# Example:
#   functions:
#     include: [Parser_*]
#     exclude: [Parser_Debug*]
functions:
  include: []
  exclude: []

limits:
  # Optional. At most this many edge values per parameter. Example:  edge_cap: 8
  edge_cap: 12

  # Optional. Size of the text buffer a fuzzer gives to a `char *` parameter.
  # Example:  buffer_size: 256
  buffer_size: 4096

  # Optional. The valid range of an integer parameter, as Function.parameter: [min, max].
  # AutoFuzz then tests min-1, min, min+1, the middle, max-1, max, max+1.
  # Example:
  #   int_ranges:
  #     Motor_SetSpeed.rpm: [0, 3000]
  int_ranges: {}

  # Optional. Text inputs for `char *` parameters, added to the default list.
  # Write plain text; {repeat, times} makes long strings.
  # Example:
  #   string_seeds:
  #     - "HELP"
  #     - "(90,5,95)"
  #     - {repeat: A, times: 300}
  string_seeds: []

harness:
  # REQUIRED. Headers every generated test includes (they must declare the functions).
  # Example:  includes: [parser.h]
  includes: []

  # Optional. How to prepare a struct parameter before the call. For a parameter of
  # type `<type> *`, AutoFuzz declares `<type> <var>;`, runs the lines,
  # and passes `&<var>`.
  # Example:
  #   setup:
  #     - type: Parser
  #       var: p
  #       lines:
  #         - Parser_Init(&p);
  setup: []

fuzz:
  # Optional. Seconds per fuzzer for `autofuzz run`. Example:  seconds: 60
  seconds: 10

# Optional. Where AutoFuzz writes everything (add it to .gitignore).
# Example:  output_dir: build/autofuzz
output_dir: autofuzz-out
